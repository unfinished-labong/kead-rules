# fly.toml app configuration file generated for kead-rules on 2026-07-30T05:55:55Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kead-rules'
primary_region = 'nrt'

[build]

[env]
  INDEX_URL = 'https://raw.githubusercontent.com/unfinished-labong/kead-rules/main/data/index.json'
  REFRESH_MIN = '30'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
