name: 별표 진단

# Actions 탭 → '별표 진단' → Run workflow 로 돌린다.
# 법제처 응답에 별표가 어떤 태그로 들어오는지만 확인하고 아무것도 커밋하지 않는다.
# 출력에 OC 값은 포함되지 않으므로 로그를 그대로 복사해도 안전하다.
on:
  workflow_dispatch:
    inputs:
      document:
        description: '확인할 규정 이름 (비우면 기본 4건)'
        required: false
        default: ''

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci || npm install

      - name: 진단 실행
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: node probe-annex.js "${{ inputs.document }}"
